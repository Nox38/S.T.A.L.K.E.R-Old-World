- type: entity
  parent: STClothingHeadBase # Can replace with our own parent later to disconnect from RU prototypes.
  id: STOWClothingHeadHelmetT3PVEBase
  description: "The Vityaz is a steel helmet from the Cold War, featuring a visor intended to protect the face against shrapnel. Certain to make it harder for mutants to reach anything vital."
  suffix: STOW, T3, PVE
  abstract: true
  components:
  - type: Craftable
  - type: IngestionBlocker
  - type: IdentityBlocker
  - type: Tag
    tags:
      - BlockMask
  - type: STWeight
    self: 4
  - type: Armor # 25% blunt, 25% slash, 80% pierce, 25% explosion. %1 reflect as it's a steel helmet. With visor raised, it grants 15% blunt, 15% slash, and 10% pierce, but doesn't block the face.
    armorClass: 3
    modifiers:
      coefficients:
        Blunt: 0.75
        Slash: 0.75
        Piercing: 0.80
  - type: ExplosionResistance
    damageCoefficient: 0.75
  - type: Reflect
    reflectProb: 0.1
    spread: 360
    reflects:
      - NonEnergy
    soundOnReflect: /Audio/_Stalker/Effects/sear.ogg
  - type: HelmetVisor
    toggleAction: ActionToggleHelmetVisor
    equippedPrefixUp: visor-up
    iconStateUp: icon-visor-up
    visorUpReflectProb: 0.1
    visorUpModifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.90
    isToggleable: true
  - type: HideLayerClothing
    slots:
    - Hair
    - HeadTop
    - Snout
  - type: SlotBlockOverride
    tag: BlockMask

