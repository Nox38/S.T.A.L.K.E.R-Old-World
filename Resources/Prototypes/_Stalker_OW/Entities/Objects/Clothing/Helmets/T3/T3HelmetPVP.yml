# Sphere Helmets

- type: entity
  parent: STOWClothingHeadHelmetT3PVPBase
  id: STOWClothingHeadHelmetT3PVPAltBase
  description: "The Sphere-08 is a combat helmet developed for the UAF, so called for its unusually round shape. It is one of the more common helmets to find in Ukraine, and as such, is often used by stalkers."
  suffix: STOW, T3, PVP
  abstract: true
  components:
    - type: Craftable

- type: entity
  parent: STOWClothingHeadHelmetT3PVPAltBase
  id: STOWClothingHeadHelmetT3PVPAltMilitary # OW Begin - Changed IDs from T3Sphere to T3PVPAlt
  name: Military Sphere-08
  description: "The Sphere-08 is a combat helmet developed for the UAF, so called for its unusually round shape. This version, used by OKSOP, has a light source built into the helmet."
  components:
    - type: Sprite
      sprite: _Stalker_EN/Objects/Clothing/hats/berill5m_helm_military.rsi
      layers:
        - state: light-icon
        - state: icon
          shader: unshaded
          visible: false
          map: [ "light" ]
    - type: Clothing
      sprite: _Stalker_EN/Objects/Clothing/hats/berill5m_helm_military.rsi
      equippedPrefix: off
    - type: Item
      heldPrefix: off
    - type: ItemTogglePointLight
    - type: PointLight # Built in light: equivalent to a pocket-mounted seclite.
      enabled: false
      mask: /Textures/Effects/LightMasks/cone.png
      autoRot: true
      radius: 8 # Controls the size and range of the light cone.
      netsync: false
    - type: Appearance
    - type: HandheldLight
      addPrefix: false
      blinkingBehaviourId: blinking
      radiatingBehaviourId: radiating
      wattage: 0.5 # Controls power efficiency.
    - type: LightBehaviour
      behaviours:
        - !type:FadeBehaviour
          id: radiating
          interpolate: Linear
          maxDuration: 2.0
          startValue: 3.0
          endValue: 2.0
          isLooped: true
          reverseWhenFinished: true
        - !type:PulseBehaviour
          id: blinking
          interpolate: Nearest
          maxDuration: 1.0
          startValue: 0.1
          endValue: 2.0
          isLooped: true
    - type: ToggleableVisuals
      spriteLayer: light
      clothingVisuals:
        head:
          - state: on-equipped-HELMET
    - type: PowerCellSlot
      cellSlotId: cell_slot
    - type: ContainerContainer
      containers:
        cell_slot: !type:ContainerSlot
    - type: ItemSlots
      slots:
        cell_slot:
          name: power-cell-slot-component-slot-name-default
          startingItem: PowerCellMedium
    - type: Craftable

- type: entity
  parent: STOWClothingHeadHelmetT3PVPAltBase
  id: STOWClothingHeadHelmetT3PVPAltDuty
  name: Duty Sphere-08 "Tower"
  description: This model is a modification of the Sphere-08 army helmet, made for the Duty faction. It provides Class 3 protection, capable of withstanding blunt impacts, shrapnel, and, to some extent, bullets of penetration classes 1 and 2. A reliable helmet at a fair price.
  components:
    - type: Sprite
      sprite: _Stalker_EN/Objects/Clothing/hats/berill5m_helm_dolg.rsi
    - type: Clothing
      sprite: _Stalker_EN/Objects/Clothing/hats/berill5m_helm_dolg.rsi

